# PROTECTED WORKFLOW: Do not modify this file unless explicitly requested.
# Production image builds and deployment belong exclusively to deploy.yml.
name: CI Quality Checks - Vesta

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint -- --max-warnings=0
        env:
          CI: true

  typecheck:
    name: TypeScript TypeCheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run TypeScript type check
        run: npx tsc --noEmit
        env:
          CI: true

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm run test -- --reporter=verbose
        env:
          CI: true
          DATABASE_URL: "******localhost:5432/vesta_test"
          NEXTAUTH_SECRET: "test-secret-min-32-chars"
          NEXTAUTH_URL: "http://localhost:3000"
          MIDTRANS_SERVER_KEY: "SERVER-test"
          MIDTRANS_CLIENT_KEY: "KEY-test"
          FONNTE_API_TOKEN: "test-token"
