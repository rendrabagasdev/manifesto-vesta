name: Deploy Next.js Docker to Fedora (Self-Hosted)

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  # 1. Build & Push image dilakukan di cloud GitHub (hemat CPU & RAM server Fedora Anda)
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Downcase Image Name
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # 2. Deploy dijalankan langsung di server Fedora via Self-Hosted Runner (tanpa SSH & tanpa IP publik!)
  deploy:
    needs: build-and-push
    runs-on: self-hosted

    steps:
      - name: Downcase Image Name
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Login, Pull, and Update Container
        run: |
          # Login ke GHCR
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

          # Pull image terbaru
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

          # Hentikan dan hapus container lama jika ada
          docker stop vesta-app || true
          docker rm vesta-app || true

          # Pastikan network vesta-network ada
          docker network create vesta-network || true

          # Jalankan container baru
          docker run -d \
            --name vesta-app \
            --restart unless-stopped \
            --network vesta-network \
            --env-file /var/www/vesta/.env \
            -p 127.0.0.1:3000:3000 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

          # Bersihkan image lama
          docker image prune -f
