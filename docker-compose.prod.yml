  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   networks:
  #     - vesta-network
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U manifesto -d appdb"]
  #     interval: 10s
