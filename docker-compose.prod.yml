# Production Docker Compose untuk Fedora Server
# Gunakan: docker-compose -f docker-compose.prod.yml up -d
# Image di-pull dari GHCR (sudah di-build oleh GitHub Actions)

services:
  app:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/${GITHUB_REPOSITORY,,}:latest
    container_name: vesta-app
    restart: unless-stopped
    networks:
      - vesta-network
    env_file:
      - /var/www/vesta/.env
    ports:
      - "127.0.0.1:3001:3000"  # Hanya localhost, diakses via Cloudflare Tunnel
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: PostgreSQL jika tidak pakai external DB
  # postgres:
